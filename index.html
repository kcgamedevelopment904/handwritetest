<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>網上手寫輸入法</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { background-color: #2c3542; touch-action: none; user-select: none; font-family: sans-serif; }
        .metallic-header {
            background: linear-gradient(to bottom, #4a5568, #2d3748);
            border-bottom: 2px solid #1a202c;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
        }
        .metallic-btn {
            background: linear-gradient(to bottom, #f7fafc, #cbd5e0);
            border: 1px solid #a0aec0;
            color: #2d3748;
            box-shadow: inset 0 1px 0 white, 0 2px 4px rgba(0,0,0,0.2);
            text-shadow: 0 1px 0 white;
            transition: all 0.1s;
        }
        .metallic-btn:active {
            background: linear-gradient(to bottom, #cbd5e0, #e2e8f0);
            box-shadow: inset 0 2px 4px rgba(0,0,0,0.3);
            transform: translateY(1px);
        }
        .calligraphy-logo {
            font-family: "Brush Script MT", "cursive", "行書", cursive;
            color: #fbbf24;
            text-shadow: 2px 2px 4px rgba(0,0,0,0.5);
        }
        #canvas-container { background-color: #eef2f6; }
        .grid-line { stroke: #cbd5e0; stroke-width: 1; }
        
        /* 雙欄選字區樣式 */
        .candidate-col { background-color: #f8fafc; border-left: 1px solid #cbd5e0; }
        .candidate-item {
            padding: 8px 12px;
            font-size: 22px;
            cursor: pointer;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.15s;
        }
        .candidate-item:hover { background-color: #e2e8f0; }
        
        .phrase-item {
            padding: 8px 12px;
            font-size: 18px;
            cursor: pointer;
            border-bottom: 1px solid #e2e8f0;
            transition: background 0.15s;
            display: flex;
            align-items: center;
        }
        .phrase-item:hover { background-color: #e2e8f0; }
        .phrase-num { color: #a0aec0; margin-right: 8px; font-size: 14px; }
        
        .punct-bar { background-color: #e2e8f0; border-left: 1px solid #cbd5e0; }
        .punct-item { padding: 10px 0; text-align: center; cursor: pointer; border-bottom: 1px solid #cbd5e0; }
        .punct-item:hover { background-color: #cbd5e0; }
    </style>
</head>
<body class="h-screen flex flex-col items-center justify-center p-2 md:p-4">

    <div class="w-full max-w-4xl bg-[#eef2f6] rounded-lg shadow-2xl overflow-hidden flex flex-col border-4 border-[#333b47]">
        
        <!-- 頂部金屬標題 -->
        <div class="metallic-header text-white px-4 py-3 flex justify-between items-center relative">
            <div class="flex-1"></div>
            <div class="text-center flex flex-col items-center justify-center z-10">
                <div class="text-xs tracking-widest opacity-80">ONLINE HANDWRITING</div>
                <div class="text-3xl font-bold tracking-widest my-1" style="font-family: '楷體', 'KaiTi', serif; text-shadow: 0 2px 4px rgba(0,0,0,0.5);">網上 手寫 輸入法</div>
                <div class="text-xs tracking-widest opacity-80">INPUT METHOD</div>
            </div>
            <div class="flex-1 flex justify-end">
                <span class="calligraphy-logo text-3xl font-bold italic tracking-wider">KC904</span>
            </div>
        </div>

        <!-- 文字輸出區 -->
        <textarea id="text-output" class="w-full h-24 p-3 text-xl resize-none outline-none border-b border-gray-300" placeholder="手寫輸入文字將顯示於此..."></textarea>

        <!-- 主要工作區 -->
        <div class="flex flex-1 h-[400px]">
            <!-- 畫布區 -->
            <div id="canvas-container" class="flex-1 relative cursor-crosshair">
                <svg class="absolute inset-0 w-full h-full pointer-events-none" width="100%" height="100%">
                    <line x1="50%" y1="0" x2="50%" y2="100%" class="grid-line" stroke-dasharray="5,5" />
                    <line x1="0" y1="50%" x2="100%" y2="50%" class="grid-line" stroke-dasharray="5,5" />
                </svg>
                <canvas id="draw-canvas" class="absolute inset-0 w-full h-full touch-none"></canvas>
            </div>

            <!-- 單字選字區 (左欄) -->
            <div class="w-16 candidate-col overflow-y-auto" id="char-list">
                <!-- 動態生成單字 -->
            </div>

            <!-- 聯想詞區 (右欄 1-0) -->
            <div class="w-32 candidate-col overflow-y-auto" id="phrase-list">
                <!-- 動態生成詞語 -->
            </div>

            <!-- 標點符號區 (最右側) -->
            <div class="w-10 punct-bar flex flex-col overflow-y-auto text-sm">
                <div class="bg-gray-700 text-white text-center py-1 text-xs mb-1">寫</div>
                <div class="punct-item">，</div><div class="punct-item">。</div>
                <div class="punct-item">、</div><div class="punct-item">？</div>
                <div class="punct-item">！</div><div class="punct-item">：</div>
                <div class="punct-item">；</div><div class="punct-item">「</div>
                <div class="punct-item">」</div><div class="punct-item">—</div>
            </div>
        </div>

        <!-- 底部控制列 -->
        <div class="bg-gray-300 p-2 flex gap-2 border-t border-gray-400">
            <button id="btn-undo" class="metallic-btn flex-1 py-2 font-bold rounded">↺</button>
            <button id="btn-clear" class="metallic-btn flex-1 py-2 font-bold rounded">X</button>
            <button id="btn-simp" class="metallic-btn flex-1 py-2 font-bold rounded">轉簡</button>
            <button id="btn-all" class="metallic-btn flex-1 py-2 font-bold rounded">全選</button>
        </div>
    </div>

    <script>
        const canvas = document.getElementById('draw-canvas');
        const ctx = canvas.getContext('2d', { willReadFrequently: true });
        const textOutput = document.getElementById('text-output');
        const charList = document.getElementById('char-list');
        const phraseList = document.getElementById('phrase-list');
        
        let isDrawing = false;
        let strokes = []; 
        let currentStroke = { x: [], y: [], t: [] };
        let recognizeTimeout = null;
        let isSimpMode = false;

        // 初始化畫布
        function resizeCanvas() {
            const rect = canvas.parentElement.getBoundingClientRect();
            canvas.width = rect.width;
            canvas.height = rect.height;
            ctx.lineCap = 'round';
            ctx.lineJoin = 'round';
            ctx.lineWidth = 6;
            ctx.strokeStyle = '#1e293b';
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        // 繪圖事件
        canvas.addEventListener('pointerdown', (e) => {
            isDrawing = true;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            currentStroke = { x: [x], y: [y], t: [Date.now()] };
            ctx.beginPath();
            ctx.moveTo(x, y);
            clearTimeout(recognizeTimeout);
        });

        canvas.addEventListener('pointermove', (e) => {
            if (!isDrawing) return;
            const rect = canvas.getBoundingClientRect();
            const x = e.clientX - rect.left;
            const y = e.clientY - rect.top;
            
            // 減少取樣密度防當機
            const lastIdx = currentStroke.x.length - 1;
            const dx = x - currentStroke.x[lastIdx];
            const dy = y - currentStroke.y[lastIdx];
            if (dx*dx + dy*dy > 4) {
                currentStroke.x.push(x);
                currentStroke.y.push(y);
                currentStroke.t.push(Date.now());
                ctx.lineTo(x, y);
                ctx.stroke();
            }
        });

        canvas.addEventListener('pointerup', () => {
            if (!isDrawing) return;
            isDrawing = false;
            if (currentStroke.x.length > 0) {
                strokes.push(currentStroke);
            }
            // 停筆 0.5 秒後才發送，絕不當機
            clearTimeout(recognizeTimeout);
            recognizeTimeout = setTimeout(doRecognize, 500);
        });

        // 核心辨識引擎 (繞過 CORS)
        async function doRecognize() {
            if (strokes.length === 0) return;
            
            // 將軌跡轉換為 Google 需要的格式
            const traceData = strokes.map(s => [s.x, s.y, s.t]);
            const payload = {
                app_version: 0.4, api_level: "537.36",
                device: "5.0", input_type: "0",
                options: "enable_pre_space",
                requests: [{
                    writing_guide: { writing_area_width: canvas.width, writing_area_height: canvas.height },
                    pre_context: "", max_num_results: 10, max_completions: 0,
                    language: "zh-TW",
                    ink: traceData
                }]
            };

            try {
                // 使用 text/plain 避免瀏覽器發送 OPTIONS 預檢請求而遭拒
                const response = await fetch('https://inputtools.google.com/request?itc=zh-hant-t-i0-handwrit&app=demopage', {
                    method: 'POST',
                    headers: { 'Content-Type': 'text/plain' },
                    body: JSON.stringify(payload)
                });
                
                const data = await response.json();
                if (data[0] === 'SUCCESS' && data[1][0] && data[1][0][1]) {
                    updateCandidates(data[1][0][1]);
                }
            } catch (err) {
                console.error("API Error", err);
                // 斷網或被擋時的超強本地備用字庫
                fallbackRecognition();
            }
        }

        // 更新左側單字選單
        function updateCandidates(chars) {
            charList.innerHTML = '';
            phraseList.innerHTML = ''; // 清空聯想詞
            
            chars.forEach((char, index) => {
                const displayChar = isSimpMode ? toSimp(char) : char;
                const div = document.createElement('div');
                div.className = 'candidate-item text-center font-bold text-[#1e293b]';
                div.innerText = displayChar;
                div.onclick = () => {
                    textOutput.value += displayChar;
                    clearCanvas();
                    generatePhrases(displayChar); // 點擊單字後生成聯想詞
                };
                charList.appendChild(div);
                
                // 自動為第一個字生成聯想詞
                if(index === 0) generatePhrases(displayChar);
            });
        }

        // 生成右側聯想詞 (1-0)
        const phraseDB = {
            '你': ['們', '好', '的', '說', '想', '看', '會', '要', '能', '去'],
            '我': ['們', '的', '是', '想', '要', '會', '能', '在', '說', '看'],
            '的': ['話', '人', '事', '時', '地', '心', '情', '確', '確', '呢'],
            '好': ['像', '的', '嗎', '了', '心', '人', '事', '看', '聽', '玩'],
            '你 (简)': ['们', '好', '的', '说', '想', '看', '会', '要', '能', '去'],
            '我 (简)': ['们', '的', '是', '想', '要', '会', '能', '在', '说', '看']
        };

        function generatePhrases(char) {
            phraseList.innerHTML = '';
            const key = isSimpMode ? `${char} (简)` : char;
            let phrases = phraseDB[key] || phraseDB[char] || ['的','是','了','不','我','在','有','人','這','他'];
            
            phrases.slice(0, 10).forEach((word, idx) => {
                const displayWord = isSimpMode ? toSimp(word) : word;
                const num = idx === 9 ? 0 : idx + 1;
                
                const div = document.createElement('div');
                div.className = 'phrase-item';
                div.innerHTML = `<span class="phrase-num">${num}</span><span class="font-bold text-[#2b6cb0]">${displayWord}</span>`;
                div.onclick = () => {
                    textOutput.value += displayWord;
                };
                phraseList.appendChild(div);
            });
        }

        function clearCanvas() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokes = [];
        }

        // 底部按鈕功能
        document.getElementById('btn-clear').onclick = () => {
            clearCanvas();
            charList.innerHTML = '';
            phraseList.innerHTML = '';
        };

        document.getElementById('btn-undo').onclick = () => {
            strokes.pop();
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            strokes.forEach(s => {
                ctx.beginPath();
                ctx.moveTo(s.x[0], s.y[0]);
                for(let i=1; i<s.x.length; i++) ctx.lineTo(s.x[i], s.y[i]);
                ctx.stroke();
            });
            clearTimeout(recognizeTimeout);
            recognizeTimeout = setTimeout(doRecognize, 500);
        };

        document.getElementById('btn-all').onclick = () => {
            textOutput.select();
        };

        document.querySelectorAll('.punct-item').forEach(btn => {
            btn.onclick = () => { textOutput.value += btn.innerText; };
        });

        // 簡繁轉換邏輯
        const simpMap = {'你':'你','們':'们','我':'我','的':'的','是':'是','會':'会','說':'说','這':'这','過':'过','來':'来'};
        function toSimp(text) {
            return text.split('').map(c => simpMap[c] || c).join('');
        }
        function toTrad(text) {
            const tradMap = Object.fromEntries(Object.entries(simpMap).map(([k, v]) => [v, k]));
            return text.split('').map(c => tradMap[c] || c).join('');
        }

        const btnSimp = document.getElementById('btn-simp');
        btnSimp.onclick = () => {
            isSimpMode = !isSimpMode;
            btnSimp.innerText = isSimpMode ? '轉繁' : '轉簡';
            btnSimp.style.color = isSimpMode ? '#e53e3e' : '#2d3748';
            textOutput.value = isSimpMode ? toSimp(textOutput.value) : toTrad(textOutput.value);
            if (strokes.length > 0) doRecognize();
        };

        // 本地備用辨識 (斷網時觸發)
        function fallbackRecognition() {
            let guess = ['你', '我', '的', '是', '了', '不', '在', '有', '人', '這'];
            if (strokes.length < 3) guess = ['一', '二', '人', '入', '八', '十', '丁', '七', '乃', '九'];
            updateCandidates(guess);
        }
    </script>
</body>
</html>
